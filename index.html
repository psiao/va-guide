<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal Soft VA Guide — Time, Attendance & Tickets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF5EC; --paper-deep:#F2EADB; --card:#FFFDF8;
    --ink:#1B2430; --ink-soft:#4A5568;
    --cobalt:#1D4ED8; --cobalt-deep:#16337F; --cobalt-tint:#E3EBFC;
    --teal:#0E7A63; --teal-tint:#DDF2EC;
    --tangerine:#C2410C; --tangerine-tint:#FCE9DD;
    --stamp:#B3541E;
    --line:#DDD3C0; --radius:16px;
    --mono:'IBM Plex Mono',monospace; --disp:'Bricolage Grotesque',sans-serif; --body:'Public Sans',sans-serif;
    --shadow:0 2px 0 rgba(27,36,48,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important;animation:none!important}}
  body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.6;font-size:16px;
    background-image:radial-gradient(rgba(27,36,48,.045) 1px, transparent 1px);background-size:22px 22px}
  .wrap{max-width:980px;margin:0 auto;padding:0 20px}

  /* ---------- links: underline everything clickable ---------- */
  a:not(.btn){color:var(--cobalt);font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--cobalt)}
  a:not(.btn):hover{color:var(--cobalt-deep);text-decoration-color:var(--cobalt-deep)}
  .btn{text-decoration:none}

  /* ---------- header ---------- */
  header{padding:48px 0 30px;border-bottom:3px solid var(--ink)}
  .masthead{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
  .head-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .admit{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:2px solid var(--stamp);color:var(--stamp);border-radius:8px;padding:6px 12px;transform:rotate(3deg);font-weight:600}
  .lang-switch{display:flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
  .lang-switch button{font:inherit;font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:.06em;padding:7px 14px;border:none;background:transparent;color:var(--ink);cursor:pointer}
  .lang-switch button.on{background:var(--ink);color:var(--paper)}
  h1{font-family:var(--disp);font-weight:800;font-size:clamp(34px,6vw,58px);line-height:1.02;letter-spacing:-.02em;margin-top:18px;max-width:780px}
  h1 .hl{color:var(--cobalt)}
  .sub{color:var(--ink-soft);margin-top:16px;max-width:620px;font-size:17px}
  .habits{display:flex;flex-wrap:wrap;gap:0;margin-top:30px;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--card)}
  .habit{flex:1 1 220px;display:flex;gap:12px;align-items:center;padding:14px 18px;border-right:2px dashed var(--line)}
  .habit:last-child{border-right:none}
  .habit .n{font-family:var(--disp);font-weight:800;font-size:26px;color:var(--cobalt);line-height:1}
  .habit .t{font-size:14px;font-weight:600;line-height:1.35}

  /* ---------- sections ---------- */
  section{padding:54px 0 6px}
  .stamp-label{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--stamp);border:2px solid var(--stamp);border-radius:8px;padding:5px 12px;transform:rotate(-2deg);margin-bottom:14px}
  h2{font-family:var(--disp);font-weight:700;font-size:clamp(26px,3.6vw,36px);letter-spacing:-.01em;margin-bottom:10px}
  .lede{color:var(--ink-soft);max-width:660px;margin-bottom:28px}

  /* ---------- ticket stubs ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
  .stub{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);text-align:left;cursor:pointer;font:inherit;color:inherit;padding:18px 18px 16px 34px;box-shadow:var(--shadow);transition:transform .15s, box-shadow .15s}
  .stub::before{content:'';position:absolute;left:16px;top:12px;bottom:12px;border-left:2px dashed var(--line)}
  .stub::after{content:'';position:absolute;left:-8px;top:50%;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);transform:translateY(-50%)}
  .stub:hover{transform:translateY(-3px);box-shadow:0 5px 0 rgba(27,36,48,.15)}
  .stub:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
  .stub.active{border-color:var(--cobalt);box-shadow:0 5px 0 var(--cobalt)}
  .stub q{font-weight:500;display:block;quotes:'\201C' '\201D';font-size:15.5px}
  .stub .meta{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
  .tag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border-radius:6px;border:1.5px solid}
  .tag.callin{background:var(--teal-tint);color:var(--teal);border-color:var(--teal)}
  .tag.correction{background:var(--cobalt-tint);color:var(--cobalt);border-color:var(--cobalt)}
  .tag.overtime{background:var(--tangerine-tint);color:var(--tangerine);border-color:var(--tangerine)}
  .tag.schedule{background:var(--amber-tint,#FBF1DD);color:#8C5A08;border-color:#8C5A08}
  .vid-badge{font-family:var(--mono);font-size:11px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:5px}
  .vid-badge::before{content:'\25B6';font-size:9px;color:var(--cobalt)}

  /* ---------- boarding pass panel ---------- */
  .panel{grid-column:1/-1;background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);display:none;overflow:hidden;box-shadow:0 5px 0 rgba(27,36,48,.15)}
  .panel.open{display:block;animation:rise .2s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .pass-top{background:var(--ink);color:var(--paper);padding:16px 24px;display:flex;flex-wrap:wrap;gap:10px 26px;align-items:baseline}
  .pass-top .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.65;display:block}
  .pass-top .val{font-family:var(--disp);font-weight:700;font-size:19px}
  .pass-top .arrow{font-size:22px;opacity:.6;align-self:center}
  .pass-body{padding:22px 24px;border-top:2px dashed var(--line)}
  .panel h4{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:4px 0 10px}
  .req{list-style:none}
  .req li{display:flex;gap:11px;padding:8px 6px;border-bottom:1px dashed var(--line);font-size:15px;cursor:pointer;border-radius:8px;transition:background .12s}
  .req li:hover{background:var(--paper-deep)}
  .req li:last-child{border-bottom:none}
  .req .box{flex:none;width:19px;height:19px;border:2px solid var(--ink);border-radius:5px;margin-top:2px;background:var(--card);display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
  .req li.checked .box{background:var(--teal);border-color:var(--teal)}
  .req li.checked .box::after{content:'\2713'}
  .req li.checked span:last-child{color:var(--teal);text-decoration:line-through;text-decoration-thickness:1px}
  .confirm-hint{font-size:13px;color:var(--ink-soft);margin-top:8px;font-style:italic}
  .btn.locked{opacity:.4;pointer-events:none;box-shadow:none;filter:grayscale(.4)}
  .stub.notsure{border-style:dashed;background:var(--paper-deep)}
  .stub.notsure q{color:var(--ink-soft)}
  .fab-wrap{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:50}
  .fab{font-family:var(--disp);font-weight:700;font-size:14.5px;border:2px solid var(--ink);border-radius:999px;padding:12px 20px;background:var(--cobalt);color:#fff;box-shadow:0 3px 0 var(--cobalt-deep);cursor:pointer;text-align:center}
  .fab:hover{transform:translateY(-2px)}
  .fab.top{background:var(--card);color:var(--ink);box-shadow:0 3px 0 rgba(27,36,48,.25);padding:10px 16px}
  .note{color:var(--ink-soft);font-size:14.5px;margin-bottom:12px}
  .after-file{margin-top:18px;background:var(--paper-deep);border:1.5px solid var(--line);border-radius:10px;padding:13px 16px;font-size:14.5px;color:var(--ink-soft)}
  .after-file b{color:var(--ink)}
  .pacific{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--stamp);border:2px solid var(--stamp);border-radius:8px;padding:7px 12px;display:inline-block;margin-top:16px;transform:rotate(-1deg)}
  .actions{margin-top:20px;display:flex;flex-wrap:wrap;gap:10px}
  .btn{display:inline-block;font-family:var(--disp);font-weight:700;font-size:15px;border-radius:10px;padding:11px 20px;border:2px solid var(--ink);transition:transform .12s;cursor:pointer}
  .btn:hover{transform:translateY(-2px)}
  .btn.primary{background:var(--cobalt);border-color:var(--cobalt-deep);color:#fff;box-shadow:0 3px 0 var(--cobalt-deep)}
  .btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 3px 0 rgba(27,36,48,.25)}
  .video-frame{margin-top:16px;border-radius:12px;overflow:hidden;border:2px solid var(--ink);background:#000}
  .video-frame iframe,.video-frame video{display:block;width:100%;aspect-ratio:16/9;border:0}

  /* ---------- leave punch cards ---------- */
  .leave-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
  .leave{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
  .leave .num{font-family:var(--disp);font-weight:800;font-size:56px;line-height:.95;letter-spacing:-.02em}
  .leave.sick .num{color:var(--teal)} .leave.pto .num{color:var(--cobalt)} .leave.client .num{color:var(--tangerine)}
  .leave .unit{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
  .leave h3{font-family:var(--disp);font-size:19px;font-weight:700;margin:10px 0 4px}
  .leave p{font-size:14.5px;color:var(--ink-soft)}
  .leave .unlock{display:inline-block;margin-top:12px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--paper-deep);border:1.5px solid var(--line);border-radius:6px;padding:4px 9px}

  /* ---------- accordions ---------- */
  details{background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
  summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 22px;font-family:var(--disp);font-weight:700;font-size:17px}
  summary::-webkit-details-marker{display:none}
  summary .sum-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  summary .chev{flex:none;width:26px;height:26px;border:2px solid var(--ink);border-radius:8px;display:grid;place-items:center;font-size:13px;transition:transform .18s;background:var(--paper-deep)}
  details[open] summary .chev{transform:rotate(90deg);background:var(--cobalt-tint)}
  details .inner{padding:0 22px 20px;color:var(--ink-soft)}
  details ol{padding-left:22px}
  details ol li{padding:5px 0}
  details b{color:var(--ink)}

  /* ---------- best practices ---------- */
  .practice{display:flex;gap:16px;background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow)}
  .practice .pn{flex:none;font-family:var(--disp);font-weight:800;font-size:24px;color:var(--cobalt);width:34px;line-height:1.2}
  .practice .pt{font-family:var(--disp);font-weight:700;font-size:16.5px;margin-bottom:3px}
  .practice .pb{font-size:14.5px;color:var(--ink-soft)}
  .practice details{border:none;box-shadow:none;margin:10px 0 0;background:transparent}
  .practice summary{padding:0;font-size:14px;font-family:var(--mono);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--cobalt);justify-content:flex-start}
  .practice summary .chev{width:20px;height:20px;font-size:10px}
  .practice details .inner{padding:10px 0 0}
  .practice .os{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--paper-deep);border:1.5px solid var(--line);border-radius:6px;padding:3px 9px;display:inline-block;margin:12px 0 6px}
  .practice .warn{border-left:4px solid var(--tangerine);padding-left:12px}

  /* ---------- quick links ---------- */
  .ql-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .ql{background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
  .ql .q-ask{font-size:14px;color:var(--ink-soft);margin-bottom:6px}
  .ql a{font-family:var(--disp);font-size:16.5px;font-weight:700}

  /* ---------- rules ---------- */
  .rules{background:var(--ink);color:var(--paper);border-radius:var(--radius);padding:26px 28px;margin-top:6px;box-shadow:0 5px 0 rgba(27,36,48,.3)}
  .rules h3{font-family:var(--disp);font-size:21px;font-weight:700;margin-bottom:14px}
  .rules h3 .hl{color:#F5B971}
  .rules ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 26px}
  .rules li{display:flex;gap:10px;font-size:14.5px;color:#E6E0D4}
  .rules li::before{content:'\2713';flex:none;font-weight:700;color:#F5B971}

  /* ---------- retirement CTA + modal ---------- */
  .retire-cta{background:linear-gradient(135deg,var(--cobalt-deep),var(--cobalt));color:#fff;border:2px solid var(--ink);border-radius:var(--radius);padding:28px 30px;box-shadow:0 5px 0 rgba(27,36,48,.3);display:flex;flex-wrap:wrap;align-items:center;gap:20px;justify-content:space-between}
  .retire-cta .rc-text{max-width:560px}
  .retire-cta h3{font-family:var(--disp);font-weight:800;font-size:clamp(20px,3vw,26px);margin-bottom:6px}
  .retire-cta p{font-size:15px;color:#D6E2F8}
  .retire-cta .btn{flex:none;background:var(--card);color:var(--ink);border-color:var(--ink);box-shadow:0 3px 0 rgba(27,36,48,.4)}
  .modal-overlay{position:fixed;inset:0;background:rgba(20,36,48,.62);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto}
  .modal-overlay.open{display:flex}
  .modal{background:var(--paper);border:2px solid var(--ink);border-radius:var(--radius);box-shadow:0 24px 60px -20px rgba(0,0,0,.55);width:100%;max-width:600px;position:relative;margin:auto}
  .modal-close{position:absolute;top:12px;right:12px;z-index:5;width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:var(--card);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow)}
  .modal-close:hover{background:var(--tangerine-tint)}
  .rt-wrap{padding:30px 28px 26px}
  .rt-brand{display:flex;align-items:center;gap:9px;justify-content:center;margin-bottom:18px}
  .rt-brand .dot{width:9px;height:9px;border-radius:50%;background:var(--tangerine)}
  .rt-brand span{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cobalt);font-weight:600}
  .rt-path{display:flex;align-items:center;justify-content:center;margin:0 auto 22px;max-width:320px}
  .rt-path .node{width:13px;height:13px;border-radius:50%;background:var(--line);flex:0 0 auto;transition:.4s}
  .rt-path .seg{height:2px;background:var(--line);flex:1 1 auto;transition:.4s}
  .rt-path .node.done{background:var(--cobalt)}
  .rt-path .node.active{background:var(--tangerine);box-shadow:0 0 0 5px var(--tangerine-tint)}
  .rt-path .seg.done{background:var(--cobalt)}
  .rt-card{background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 26px 26px}
  .rt-step{animation:rise .4s ease-out both}
  .rt-eyebrow{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.1em;color:var(--tangerine);text-transform:uppercase;margin-bottom:10px}
  .rt-card h1{font-family:var(--disp);font-weight:800;font-size:27px;line-height:1.12;color:var(--ink);letter-spacing:-.01em;max-width:none}
  .rt-card h2{font-family:var(--disp);font-weight:700;font-size:22px;line-height:1.18;color:var(--ink)}
  .rt-lede{color:var(--ink-soft);font-size:15.5px;margin-top:11px}
  .rt-hint{color:var(--ink-soft);font-size:13.5px;margin-top:8px}
  .rt-controls{margin-top:22px;display:flex;flex-direction:column;gap:10px}
  .rt-btn{font-family:var(--disp);font-size:15.5px;font-weight:700;border:2px solid var(--ink);cursor:pointer;border-radius:11px;padding:13px 16px;transition:transform .12s;text-align:left;width:100%;display:block;text-decoration:none}
  .rt-btn:hover{transform:translateY(-2px)}
  .rt-btn:active{transform:translateY(1px)}
  .rt-primary{background:var(--cobalt);color:#fff;border-color:var(--cobalt-deep);text-align:center;box-shadow:0 3px 0 var(--cobalt-deep)}
  a.rt-primary, a.rt-primary:hover{color:#fff;text-decoration:none}
  .rt-primary:hover{background:var(--cobalt-deep)}
  .rt-primary[disabled]{opacity:.4;pointer-events:none}
  .rt-choice{background:var(--paper-deep);color:var(--ink);display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
  .rt-choice:hover{background:var(--cobalt-tint)}
  .rt-choice .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--cobalt);flex:0 0 auto;opacity:.5}
  .rt-ghost{background:transparent;color:var(--ink-soft);font-weight:600;text-align:center;border-color:transparent;box-shadow:none;font-family:var(--body)}
  .rt-ghost:hover{color:var(--ink);transform:none}
  .rt-field{margin-top:20px}
  .rt-field label{display:block;font-weight:600;font-size:14px;margin-bottom:8px;color:var(--ink)}
  .rt-field input[type=date]{font-family:var(--body);font-size:16px;width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:11px;color:var(--ink);background:var(--card)}
  .rt-field input[type=date]:focus{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 4px var(--cobalt-tint)}
  .rt-reveal{background:var(--cobalt-tint);border-radius:12px;padding:15px 16px;margin-top:18px;border-left:4px solid var(--tangerine)}
  .rt-reveal .big{font-family:var(--disp);font-size:19px;color:var(--ink);font-weight:700}
  .rt-reveal p{font-size:14px;color:var(--ink-soft);margin-top:5px}
  .rt-badge{display:inline-block;background:var(--cobalt);color:#fff;font-family:var(--mono);font-weight:600;font-size:12.5px;padding:6px 14px;border-radius:999px;margin-top:12px}
  .rt-result-head{text-align:center;margin-bottom:6px}
  .rt-timeline{margin:24px 0 6px;padding-left:6px}
  .rt-stop{display:flex;gap:15px;position:relative;padding-bottom:20px}
  .rt-stop:last-child{padding-bottom:0}
  .rt-rail{position:relative;flex:0 0 auto;width:16px;display:flex;justify-content:center}
  .rt-rail::before{content:"";position:absolute;top:16px;bottom:-4px;width:2px;background:var(--line)}
  .rt-stop:last-child .rt-rail::before{display:none}
  .rt-marker{width:16px;height:16px;border-radius:50%;background:var(--card);border:3px solid var(--cobalt);z-index:1;margin-top:2px}
  .rt-marker.reward{border-color:var(--tangerine);background:var(--tangerine)}
  .rt-stop .date{font-weight:700;font-size:14px;color:var(--ink)}
  .rt-stop .what{font-size:14px;color:var(--cobalt-deep);font-weight:700;margin-top:1px}
  .rt-stop .note{font-size:13px;color:var(--ink-soft);margin-top:2px}
  .rt-realize{background:var(--ink);color:#fff;border-radius:14px;padding:18px 20px;margin:20px 0}
  .rt-realize .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#F5B971;font-weight:600}
  .rt-realize .v{font-family:var(--disp);font-size:20px;font-weight:700;margin-top:6px;line-height:1.25}
  .rt-realize .s{font-size:14px;color:#C9D4E4;margin-top:8px}
  .rt-panel{border:2px solid var(--line);border-radius:12px;padding:15px 16px;margin-top:13px;background:var(--card)}

      "Download from "+A_DL+" (Desktop tab) for Windows, macOS, or Linux.",
      "Run the installer, then launch the app named <b>Hubstaff</b> and sign in. On Windows, don\u2019t open the <b>.exe installer file</b> to start the app \u2014 it reinstalls every time.",

    { vid:"timesheet", title:"Submit your timesheet", steps:[

      "Go to <b>Timesheets \u2192 Approvals</b>.",
      "Review your total worked hours and activity for the pay period. If anything is wrong, file a <b>Timesheet Correction ticket first</b>.",
      "Click the <b>Action</b> button on the far right of the timesheet and select <b>Submit</b>.",
    ]},
    { vid:"verify", title:"Verify your total hours", steps:[
      "Go to <b>Reports \u2192 Time and Activity</b>.",
      "Pick your date range and click <b>Apply</b>.",
      "Check totals, average productivity, and the daily breakdown. Do this once or twice a week \u2014 catching a gap early means fresher proof of work.",
    ]},
    { vid:"screenshots", title:"View your screenshots", steps:[
      "Go to <b>Activity \u2192 Screenshots</b>.",
      "Three screenshots are captured per 10-minute block on each active monitor. This activity trail is what validates your hours \u2014 and your proof if a timer ever fails.",
    ]},
    { vid:"credits", title:"Check your time off credits", steps:[
      "Log in to "+A_APP+" and go to <b>Calendar \u2192 Time off requests</b>.",
      "Click <b>Request time off</b> and select a policy in the <b>Policy</b> field \u2014 Sick Leave, Legal Soft PTO, or Client PTO.",
      "Look at the box on the right: it shows your <b>current balance</b>, hours already used, and what\u2019s left for that policy.",
      "Just checking? Close the window without clicking Send \u2014 nothing is submitted until you send the request.",
    ]},
    { vid:"timezone", title:"Set your timezone", steps:[
      "Click your avatar \u2192 <b>My account</b> \u2192 <b>Time zone</b>.",
      "Set it to <b>your client\u2019s timezone</b> and click Save.",
      "Remember: your <b>account</b> follows the client\u2019s timezone, but every <b>ticket</b> is filed in Pacific Time. Two different settings, two different jobs.",
    ]},
    { vid:"connection", title:"Timer trouble? Fix connection issues", steps:[
      "<b>Disconnect any VPN or proxy</b> \u2014 Hubstaff doesn\u2019t support them, and they\u2019re the most common cause of connection failures.",
      "Restart your modem/router (off for 10 minutes), then reconnect.",
      "Update your operating system fully, including optional updates (certificate updates matter).",
      "Temporarily disable firewall/antivirus, close Hubstaff, restart your computer, start Hubstaff.",
      "Still stuck? Submit a ticket describing what you tried. If you lost tracked time while working, also file a <b>Hubstaff Error</b> correction with proof of work.",
    ]},
  ],

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function videoEmbed(url, title, watchLabel){
  if(!url) return "";
  const t = esc(title || "Video");
  let m;
  if((m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,})/)))
    return frame("<iframe src='https://www.youtube-nocookie.com/embed/"+m[1]+"' title='"+t+"' allowfullscreen loading='lazy'></iframe>");
  if((m = url.match(/loom\.com\/share\/([\w-]+)/)))
    return frame("<iframe src='https://www.loom.com/embed/"+m[1]+"' title='"+t+"' allowfullscreen loading='lazy'></iframe>");
  if((m = url.match(/vimeo\.com\/(\d+)/)))
    return frame("<iframe src='https://player.vimeo.com/video/"+m[1]+"' title='"+t+"' allowfullscreen loading='lazy'></iframe>");
  if(/\.(mp4|webm)(\?|$)/i.test(url))
    return frame("<video controls preload='metadata' title='"+t+"'><source src='"+esc(url)+"'></video>");
  return "<p style='margin-top:12px'><a href='"+esc(url)+"' target='_blank' rel='noopener'>"+esc(watchLabel)+"</a></p>";
  function frame(inner){ return "<div class='video-frame'>"+inner+"</div>"; }
}

    item.steps.map(st=>"<li>"+st+"</li>").join("")+

  return d;
}

function openScenario(i,btn,panel){
  const C = getContent();
  const buttons = document.querySelectorAll("#scenario-grid .stub");
  if(current===i){ panel.classList.remove("open"); btn.classList.remove("active"); btn.setAttribute("aria-expanded","false"); current=-1; return; }
  buttons.forEach(b=>{b.classList.remove("active");b.setAttribute("aria-expanded","false");});
  btn.classList.add("active"); btn.setAttribute("aria-expanded","true");
  const s = C.scenarios[i];
  const docs = C.docSets[s.docs] || [];
  const L = C.panelLabels;
  const isCsm = s.process === "csm";
  const heading = isCsm ? L.sendToCsm : L.haveReady;
  const afterNote = isCsm ? L.afterCsm : L.afterFile;
  const actionsHtml = isCsm
    ? "<div class='actions'><button class='btn primary locked' id='submit-btn' aria-disabled='true' type='button'>"+L.copyTemplate+"</button></div>"+
      "<p class='confirm-hint' id='copy-feedback' style='display:none'>"+esc(L.copied)+"</p>"
    : "<div class='actions'><a class='btn primary locked' id='submit-btn' aria-disabled='true' href='"+SHARED.ticketUrl+"' target='_blank' rel='noopener'>"+L.submit+"</a>"+
      "<a class='btn ghost' href='"+SHARED.timezoneConverter+"' target='_blank' rel='noopener'>"+L.convert+"</a></div>";
  panel.innerHTML =
    "<div class='pass-top'>"+
      "<div><span class='lab'>"+L.ticketType+"</span><span class='val'>"+s.route[0]+"</span></div>"+
      "<div class='arrow'>&rarr;</div>"+
      "<div><span class='lab'>"+(s.route[1].startsWith("Make-up") ? L.detail : L.issueType)+"</span><span class='val'>"+s.route[1]+"</span></div>"+
    "</div>"+
    "<div class='pass-body'>"+
    (s.note ? "<p class='note'>"+s.note+"</p>" : "")+
    "<h4>"+heading+"</h4><ul class='req'>"+
    docs.map(d=>"<li role='checkbox' aria-checked='false' tabindex='0'><span class='box' aria-hidden='true'></span><span>"+d+"</span></li>").join("")+
    "</ul>"+
    "<p class='confirm-hint'>"+esc(L.confirmHint)+"</p>"+
    videoEmbed(VIDEOS[s.id], s.route.join(" \u2014 "), C.watchLink)+
    "<div class='after-file'>"+afterNote+"</div>"+
    "<div><span class='pacific'>"+L.pacific+"</span></div>"+
    actionsHtml+
    "</div>";
  // checklist gating: submit unlocks only when every requirement is confirmed
  const items = panel.querySelectorAll(".req li");
  const submitBtn = panel.querySelector("#submit-btn");
  const refresh = ()=>{
    const all = [...items].every(li=>li.classList.contains("checked"));
    submitBtn.classList.toggle("locked", !all);
    submitBtn.setAttribute("aria-disabled", String(!all));
  };
  items.forEach(li=>{
    const toggle = ()=>{ li.classList.toggle("checked"); li.setAttribute("aria-checked", li.classList.contains("checked")); refresh(); };
    li.addEventListener("click", toggle);
    li.addEventListener("keydown", e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); toggle(); } });
  });
  if(isCsm){
    submitBtn.addEventListener("click", ()=>{
      const template = docs.slice(0,4).map(d=>d+": ").join("\n") + "\n" + docs[4] + ": " + (LANG==="es" ? "(adjunta)" : "(attached)");
      const done = ()=>{ const f=panel.querySelector("#copy-feedback"); if(f) f.style.display="block"; };
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(template).then(done).catch(done); }
      else { const ta=document.createElement("textarea"); ta.value=template; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove(); done(); }
    });
  }
  panel.classList.add("open");
  current = i;
  panel.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function openNotSure(btn,panel){
  const C = getContent();
  const buttons = document.querySelectorAll("#scenario-grid .stub");
  if(current==="ns"){ panel.classList.remove("open"); btn.classList.remove("active"); btn.setAttribute("aria-expanded","false"); current=-1; return; }
  buttons.forEach(b=>{b.classList.remove("active");b.setAttribute("aria-expanded","false");});
  btn.classList.add("active"); btn.setAttribute("aria-expanded","true");
  panel.innerHTML =
    "<div class='pass-top'><div><span class='lab'>&nbsp;</span><span class='val'>"+esc(C.notSure.title)+"</span></div></div>"+
    "<div class='pass-body'><p style='font-size:15.5px'>"+C.notSure.body+"</p></div>";
  panel.classList.add("open");
  current = "ns";
  panel.scrollIntoView({behavior:"smooth",block:"nearest"});
}

      "<div class='rt-controls' id='rt-opts'></div>");
    const o=document.getElementById('rt-opts');
    o.appendChild(choiceBtn("No, I\u2019ve stayed continuously", ()=>{state.continuous=true; state.gap=null; showResult();}));
    o.appendChild(choiceBtn("Yes, I separated and came back", ()=>{state.continuous=false; stepGap();}));
  }
  function stepGap(){
    render(3, "<div class='rt-eyebrow'>One more thing</div>"+
      "<h2>How long was it between your separation date and your return?</h2>"+
      "<p class='rt-hint'>The length of the gap decides what happens to the benefits you\u2019d already earned.</p>"+
      "<div class='rt-controls' id='rt-opts'></div>");
    const o=document.getElementById('rt-opts');
    o.appendChild(choiceBtn("Within 30 days", ()=>{state.gap="le30"; showResult();}));
    o.appendChild(choiceBtn("31 to 90 days", ()=>{state.gap="mid"; showResult();}));
    o.appendChild(choiceBtn("More than 90 days", ()=>{state.gap="gt90"; showLongGap();}));
  }
  function showResult(){
    const g=classify(state.dep); const G=GROUPS[g];
    const PROGRAM_START = new Date(2023,5,1);
    let benefitStart = state.dep, floored = false;
    if(g==="1" && benefitStart < PROGRAM_START){ benefitStart = PROGRAM_START; floored = true; }
    const vest = addYears(benefitStart, G.vestYrs);
    const transition = addDays(vest,1);
    const payout = quarterlyPayout(vest);
    const vested = TODAY >= vest;
    const monthsToVest = monthsBetween(TODAY, vest);
    let stops = [];
    stops.push({date:fmt(state.dep), what:"You started", note:"Your retirement benefit clock begins here.", cls:""});
    stops.push({date:fmt(vest), what:"You vest ("+G.vestLabel+")", note: floored ? "Your Retirement Fund vests. (For VAs who started before June 2023, the benefit period begins June 1, 2023.)" : "Your Retirement Fund fully vests.", cls:"reward"});
    stops.push({date:fmt(transition), what:"Move into the Milestone Program", note:"The day after you vest.", cls:""});
    stops.push({date:fmt(payout)+" (est.)", what:"Retirement Fund payout", note:"Estimated release date \u2014 your vested fund is paid on the quarterly schedule after your vesting date. Ops Support confirms the exact date.", cls:"reward"});
    stops.push({date:"Each year after", what:"$750 Milestone benefit", note:"A separate, flat payout that follows \u2014 this is the Milestone Program, which starts once your Retirement Fund has been paid. No staggered amounts.", cls:"reward"});
    const timelineHtml = stops.map(s=>"<div class='rt-stop'><div class='rt-rail'><div class='rt-marker "+s.cls+"'></div></div>"+
      "<div><div class='date'>"+s.date+"</div><div class='what'>"+s.what+"</div><div class='note'>"+s.note+"</div></div></div>").join('');
    let apprTitle, apprBody, realizeK, realizeV, realizeS;
    if(vested){
      apprTitle="Thank you for your "+(G.vestYrs===1?"first year":G.vestLabel)+" with Legal Soft.";
      apprBody="Choosing to grow your career with us this long is a real commitment. Reaching this milestone is something to be proud of \u2014 and this benefit exists to honor your loyalty.";
      realizeK="You\u2019ve reached it";
      realizeV="Congratulations \u2014 you\u2019ve reached your "+G.vestYrs+"-year milestone on "+fmt(vest)+".";
      realizeS="That\u2019s a genuine achievement. Your estimated payout is around "+fmt(payout)+" \u2014 as long as you\u2019re active and full-time, you\u2019re in the payout window. Ops Support confirms the exact date.";
    } else {
      apprTitle="Thank you for growing with Legal Soft.";
      apprBody="You\u2019re on your way to an important milestone, and every month of your commitment already matters to us. Here\u2019s what your loyalty is building toward.";
      realizeK="Where you are now";
      realizeV="You vest on "+fmt(vest)+" \u2014 about "+Math.max(0,monthsToVest)+" month"+(monthsToVest===1?"":"s")+" away.";
      realizeS="Every month you stay brings you closer, and it already counts. Once you reach it, your estimated payout follows around "+fmt(payout)+".";
    }
    let notes="";
    if(state.continuous===false && state.gap==="le30"){
      notes += "<div class='rt-panel'><h3>Your break in service</h3><p>You were realigned within 30 days of your separation, so you keep every benefit you had already accrued and continue to accrue at your original monthly rate. Your path below is unchanged.</p></div>";
    } else if(state.continuous===false && state.gap==="mid"){
      notes += "<div class='rt-panel' style='border-color:var(--tangerine)'><h3>Your break in service</h3><p>You were realigned after the 30-day grace period but within 90 days, so you keep every benefit you had already accrued and your vesting still stands. From your return onward, new benefits accrue at your new contract\u2019s monthly rate, which is lower \u2014 so your final amount may differ from the standard figure above. Ops Support can confirm your exact amount.</p></div>";
    }
    render(4, "<div class='rt-appreciate'><div class='rt-ap-eyebrow'>A milestone in your career</div>"+
      "<div class='rt-ap-title'>"+apprTitle+"</div><div class='rt-ap-body'>"+apprBody+"</div></div>"+
      "<div class='rt-result-head'><div class='rt-eyebrow'>Your retirement path</div><h2>Here\u2019s where you stand.</h2>"+
      "<div class='rt-badge'>"+G.name+" \u00B7 vests after "+G.vestLabel+"</div></div>"+
      "<div class='rt-realize'><div class='k'>"+realizeK+"</div><div class='v'>"+realizeV+"</div><div class='s'>"+realizeS+"</div></div>"+
      "<div class='rt-timeline'>"+timelineHtml+"</div>"+
      "<div class='rt-panel'><h3>What you receive</h3><p>"+G.reward+"</p></div>"+
      "<div class='rt-panel'><h3>Why the payout isn\u2019t the same day</h3><p>Hitting your vesting date means you\u2019ve <em>earned</em> the benefit \u2014 but the money won\u2019t land that exact day, and that\u2019s completely normal. Behind the scenes your fund is finalized, your records are checked, and payroll releases it on the company\u2019s regular payout schedule: the 15th, usually within 30\u201345 days of your vesting date. Nothing is stuck, and there\u2019s nothing you need to chase \u2014 it\u2019s simply the standard process every payout goes through.</p></div>"+
      "<div class='rt-panel'><h3>To receive your payout you need</h3><ul class='rt-checklist'>"+
      "<li><span class='c'>\u2713</span> To be active and full-time when it\u2019s paid</li>"+
      "<li><span class='c'>\u2713</span> Your eligibility and records validated</li>"+
      "<li><span class='c'>\u2713</span> Payroll processing</li>"+
      "<li><span class='c'>\u2713</span> Leadership review and approval</li></ul></div>"+
      notes+
      "<div class='rt-panel' style='border-color:var(--tangerine)'><h3>Still have questions?</h3>"+
      "<p style='margin-bottom:12px'>Create a ticket and Ops Support will follow up with your official details.</p>"+
      "<a class='rt-btn rt-primary' href='"+TICKET_URL+"' target='_blank' rel='noopener'>Create a support ticket</a>"+
      "<p class='rt-cat-hint'>On the form, choose <strong>\u201CLegal Soft Milestone Program\u201D</strong> as the issue category.</p></div>"+
      "<p class='rt-disclaimer'>All amounts and dates shown here are tentative estimates, not a guarantee of payment. Your official group, vesting dates, and amounts are confirmed by Ops Support against validated records.</p>"+
      "<div class='rt-controls'><button class='rt-btn rt-ghost' id='rt-restart'>\u21BA Start over</button></div>");
    document.getElementById('rt-restart').onclick=resetAll;
  }
  function showInactive(){
    render(4, "<div class='rt-result-head'><div class='rt-eyebrow'>Your status</div><h2>You\u2019re not eligible for a payout just yet.</h2></div>"+
      "<div class='rt-realize'><div class='k'>Why</div><div class='v'>Retirement payouts are released only while you\u2019re active and working full-time.</div>"+
      "<div class='s'>Since you\u2019re not active full-time right now, there isn\u2019t a payout to process at this moment. If your status changes, your eligibility can pick back up. Ops Support can explain exactly where you stand.</div></div>"+
      ticketPanel("Get your details","Reach out to Ops Support to understand your situation.")+
      "<p class='rt-disclaimer'>Eligibility, amounts, and dates are confirmed by Ops Support against validated records.</p>"+
      "<div class='rt-controls'><button class='rt-btn rt-ghost' id='rt-restart'>\u21BA Start over</button></div>");
    document.getElementById('rt-restart').onclick=resetAll;
  }
  function showLongGap(){
    render(4, "<div class='rt-result-head'><div class='rt-eyebrow'>Your status</div><h2>Let\u2019s have the helpdesk check your record.</h2></div>"+
      "<div class='rt-realize'><div class='k'>Why</div><div class='v'>Because your break was longer than 90 days, you\u2019re treated as a new hire.</div>"+
      "<div class='s'>Any retirement benefits you had accrued before are forfeited, and your accrual restarts from your new hire date under your new contract\u2019s terms \u2014 which usually means the newer version of the program (Group 2 or Group 3). The helpdesk can confirm your current group, vesting date, and payout date.</div></div>"+
      ticketPanel("Confirm your status","The helpdesk can tell you your current group, vesting date, and payout date.")+
      "<p class='rt-disclaimer'>Your official group, dates, and amounts are confirmed by Ops Support against validated records.</p>"+
      "<div class='rt-controls'><button class='rt-btn rt-ghost' id='rt-restart'>\u21BA Start over</button></div>");
    document.getElementById('rt-restart').onclick=resetAll;
  }
  function resetAll(){ state.dep=null; state.active=null; state.continuous=null; state.gap=null; intro(); }

  function openModal(){ resetAll(); overlay.classList.add('open'); document.body.style.overflow='hidden'; document.getElementById('retire-close').focus(); }
  function closeModal(){ overlay.classList.remove('open'); document.body.style.overflow=''; }
  document.getElementById('retire-open').addEventListener('click', openModal);
  document.getElementById('retire-close').addEventListener('click', closeModal);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && overlay.classList.contains('open')) closeModal(); });
})();

/* ============================================================
   EMPLOYEE ID GATE
   Format check only (VS+5 digits or MLG+4 digits). This is a
   convenience + tone gate, NOT access control: a static page
   cannot truly authenticate. It also stores the EID for the
   session and makes it available to pre-fill forms.
   ============================================================ */
window.VA_EID = null;
(function(){
  const EID_RE = /^(VS\d{5}|MLG\d{4})$/;
  const gate = document.getElementById('eid-gate');
  const input = document.getElementById('eid-input');
  const btn = document.getElementById('eid-btn');
  const hint = document.getElementById('eid-hint');

  let stored = null;
  try { stored = sessionStorage.getItem('va_eid'); } catch(e){}
  if(stored && EID_RE.test(stored)){ window.VA_EID = stored; gate.classList.add('hidden'); }

  function attempt(){
    const val = (input.value||'').toUpperCase().replace(/[\s-]/g,'').trim();
    if(EID_RE.test(val)){
      window.VA_EID = val;
      try { sessionStorage.setItem('va_eid', val); } catch(e){}
      gate.classList.add('hidden');
      hint.textContent=''; hint.classList.remove('err'); input.classList.remove('err');
    } else {
      const C = getContent();
      hint.textContent = C.eidErr; hint.classList.add('err'); input.classList.add('err');
      input.focus();
    }
  }
  btn.addEventListener('click', attempt);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') attempt(); });
  input.addEventListener('input', ()=>{ input.classList.remove('err'); hint.classList.remove('err'); hint.textContent=''; });
  if(!window.VA_EID) setTimeout(()=>input.focus(), 100);

  window.changeEID = function(){
    try { sessionStorage.removeItem('va_eid'); } catch(e){}
    window.VA_EID = null; input.value=''; gate.classList.remove('hidden'); setTimeout(()=>input.focus(),100);
  };
})();

render();
</script>
</body>
</html>
