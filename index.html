<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal Soft VA Guide — Time, Attendance & Tickets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF5EC; --paper-deep:#F2EADB; --card:#FFFDF8;
    --ink:#1B2430; --ink-soft:#4A5568;
    --cobalt:#1D4ED8; --cobalt-deep:#16337F; --cobalt-tint:#E3EBFC;
    --teal:#0E7A63; --teal-tint:#DDF2EC;
    --tangerine:#C2410C; --tangerine-tint:#FCE9DD;
    --stamp:#B3541E;
    --line:#DDD3C0; --radius:16px;
    --mono:'IBM Plex Mono',monospace; --disp:'Bricolage Grotesque',sans-serif; --body:'Public Sans',sans-serif;
    --shadow:0 2px 0 rgba(27,36,48,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important;animation:none!important}}
  body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.6;font-size:16px;
    background-image:radial-gradient(rgba(27,36,48,.045) 1px, transparent 1px);background-size:22px 22px}
  .wrap{max-width:980px;margin:0 auto;padding:0 20px}

  /* ---------- links: underline everything clickable ---------- */
  a:not(.btn){color:var(--cobalt);font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--cobalt)}
  a:not(.btn):hover{color:var(--cobalt-deep);text-decoration-color:var(--cobalt-deep)}
  .btn{text-decoration:none}

  /* ---------- header ---------- */
  header{padding:48px 0 30px;border-bottom:3px solid var(--ink)}
  .masthead{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
  .head-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .admit{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:2px solid var(--stamp);color:var(--stamp);border-radius:8px;padding:6px 12px;transform:rotate(3deg);font-weight:600}
  .lang-switch{display:flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
  .lang-switch button{font:inherit;font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:.06em;padding:7px 14px;border:none;background:transparent;color:var(--ink);cursor:pointer}
  .lang-switch button.on{background:var(--ink);color:var(--paper)}
  h1{font-family:var(--disp);font-weight:800;font-size:clamp(34px,6vw,58px);line-height:1.02;letter-spacing:-.02em;margin-top:18px;max-width:780px}
  h1 .hl{color:var(--cobalt)}
  .sub{color:var(--ink-soft);margin-top:16px;max-width:620px;font-size:17px}
  .habits{display:flex;flex-wrap:wrap;gap:0;margin-top:30px;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--card)}
  .habit{flex:1 1 220px;display:flex;gap:12px;align-items:center;padding:14px 18px;border-right:2px dashed var(--line)}
  .habit:last-child{border-right:none}
  .habit .n{font-family:var(--disp);font-weight:800;font-size:26px;color:var(--cobalt);line-height:1}
  .habit .t{font-size:14px;font-weight:600;line-height:1.35}

  /* ---------- sections ---------- */
  section{padding:54px 0 6px}
  .stamp-label{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--stamp);border:2px solid var(--stamp);border-radius:8px;padding:5px 12px;transform:rotate(-2deg);margin-bottom:14px}
  h2{font-family:var(--disp);font-weight:700;font-size:clamp(26px,3.6vw,36px);letter-spacing:-.01em;margin-bottom:10px}
  .lede{color:var(--ink-soft);max-width:660px;margin-bottom:28px}

  /* ---------- ticket stubs ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
  .stub{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);text-align:left;cursor:pointer;font:inherit;color:inherit;padding:18px 18px 16px 34px;box-shadow:var(--shadow);transition:transform .15s, box-shadow .15s}
  .stub::before{content:'';position:absolute;left:16px;top:12px;bottom:12px;border-left:2px dashed var(--line)}
  .stub::after{content:'';position:absolute;left:-8px;top:50%;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);transform:translateY(-50%)}
  .stub:hover{transform:translateY(-3px);box-shadow:0 5px 0 rgba(27,36,48,.15)}
  .stub:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
  .stub.active{border-color:var(--cobalt);box-shadow:0 5px 0 var(--cobalt)}
  .stub q{font-weight:500;display:block;quotes:'\201C' '\201D';font-size:15.5px}
  .stub .meta{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
  .tag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border-radius:6px;border:1.5px solid}
  .tag.callin{background:var(--teal-tint);color:var(--teal);border-color:var(--teal)}
  .tag.correction{background:var(--cobalt-tint);color:var(--cobalt);border-color:var(--cobalt)}
  .tag.overtime{background:var(--tangerine-tint);color:var(--tangerine);border-color:var(--tangerine)}
  .vid-badge{font-family:var(--mono);font-size:11px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:5px}
  .vid-badge::before{content:'\25B6';font-size:9px;color:var(--cobalt)}

  /* ---------- boarding pass panel ---------- */
  .panel{grid-column:1/-1;background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);display:none;overflow:hidden;box-shadow:0 5px 0 rgba(27,36,48,.15)}
  .panel.open{display:block;animation:rise .2s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .pass-top{background:var(--ink);color:var(--paper);padding:16px 24px;display:flex;flex-wrap:wrap;gap:10px 26px;align-items:baseline}
  .pass-top .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.65;display:block}
  .pass-top .val{font-family:var(--disp);font-weight:700;font-size:19px}
  .pass-top .arrow{font-size:22px;opacity:.6;align-self:center}
  .pass-body{padding:22px 24px;border-top:2px dashed var(--line)}
  .panel h4{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:4px 0 10px}
  .req{list-style:none}
  .req li{display:flex;gap:11px;padding:8px 6px;border-bottom:1px dashed var(--line);font-size:15px;cursor:pointer;border-radius:8px;transition:background .12s}
  .req li:hover{background:var(--paper-deep)}
  .req li:last-child{border-bottom:none}
  .req .box{flex:none;width:19px;height:19px;border:2px solid var(--ink);border-radius:5px;margin-top:2px;background:var(--card);display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
  .req li.checked .box{background:var(--teal);border-color:var(--teal)}
  .req li.checked .box::after{content:'\2713'}
  .req li.checked span:last-child{color:var(--teal);text-decoration:line-through;text-decoration-thickness:1px}
  .confirm-hint{font-size:13px;color:var(--ink-soft);margin-top:8px;font-style:italic}
  .btn.locked{opacity:.4;pointer-events:none;box-shadow:none;filter:grayscale(.4)}
  .stub.notsure{border-style:dashed;background:var(--paper-deep)}
  .stub.notsure q{color:var(--ink-soft)}
  .fab-wrap{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:50}
  .fab{font-family:var(--disp);font-weight:700;font-size:14.5px;border:2px solid var(--ink);border-radius:999px;padding:12px 20px;background:var(--cobalt);color:#fff;box-shadow:0 3px 0 var(--cobalt-deep);cursor:pointer;text-align:center}
  .fab:hover{transform:translateY(-2px)}
  .fab.top{background:var(--card);color:var(--ink);box-shadow:0 3px 0 rgba(27,36,48,.25);padding:10px 16px}
  .note{color:var(--ink-soft);font-size:14.5px;margin-bottom:12px}
  .after-file{margin-top:18px;background:var(--paper-deep);border:1.5px solid var(--line);border-radius:10px;padding:13px 16px;font-size:14.5px;color:var(--ink-soft)}
  .after-file b{color:var(--ink)}
  .pacific{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--stamp);border:2px solid var(--stamp);border-radius:8px;padding:7px 12px;display:inline-block;margin-top:16px;transform:rotate(-1deg)}
  .actions{margin-top:20px;display:flex;flex-wrap:wrap;gap:10px}
  .btn{display:inline-block;font-family:var(--disp);font-weight:700;font-size:15px;border-radius:10px;padding:11px 20px;border:2px solid var(--ink);transition:transform .12s;cursor:pointer}
  .btn:hover{transform:translateY(-2px)}
  .btn.primary{background:var(--cobalt);border-color:var(--cobalt-deep);color:#fff;box-shadow:0 3px 0 var(--cobalt-deep)}
  .btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 3px 0 rgba(27,36,48,.25)}
  .video-frame{margin-top:16px;border-radius:12px;overflow:hidden;border:2px solid var(--ink);background:#000}
  .video-frame iframe,.video-frame video{display:block;width:100%;aspect-ratio:16/9;border:0}

  /* ---------- leave punch cards ---------- */
  .leave-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
  .leave{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
  .leave .num{font-family:var(--disp);font-weight:800;font-size:56px;line-height:.95;letter-spacing:-.02em}
  .leave.sick .num{color:var(--teal)} .leave.pto .num{color:var(--cobalt)} .leave.client .num{color:var(--tangerine)}
  .leave .unit{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
  .leave h3{font-family:var(--disp);font-size:19px;font-weight:700;margin:10px 0 4px}
  .leave p{font-size:14.5px;color:var(--ink-soft)}
  .leave .unlock{display:inline-block;margin-top:12px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--paper-deep);border:1.5px solid var(--line);border-radius:6px;padding:4px 9px}

  /* ---------- accordions ---------- */
  details{background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
  summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 22px;font-family:var(--disp);font-weight:700;font-size:17px}
  summary::-webkit-details-marker{display:none}
  summary .sum-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  summary .chev{flex:none;width:26px;height:26px;border:2px solid var(--ink);border-radius:8px;display:grid;place-items:center;font-size:13px;transition:transform .18s;background:var(--paper-deep)}
  details[open] summary .chev{transform:rotate(90deg);background:var(--cobalt-tint)}
  details .inner{padding:0 22px 20px;color:var(--ink-soft)}
  details ol{padding-left:22px}
  details ol li{padding:5px 0}
  details b{color:var(--ink)}

  /* ---------- best practices ---------- */
  .practice{display:flex;gap:16px;background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow)}
  .practice .pn{flex:none;font-family:var(--disp);font-weight:800;font-size:24px;color:var(--cobalt);width:34px;line-height:1.2}
  .practice .pt{font-family:var(--disp);font-weight:700;font-size:16.5px;margin-bottom:3px}
  .practice .pb{font-size:14.5px;color:var(--ink-soft)}
  .practice details{border:none;box-shadow:none;margin:10px 0 0;background:transparent}
  .practice summary{padding:0;font-size:14px;font-family:var(--mono);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--cobalt);justify-content:flex-start}
  .practice summary .chev{width:20px;height:20px;font-size:10px}
  .practice details .inner{padding:10px 0 0}
  .practice .os{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--paper-deep);border:1.5px solid var(--line);border-radius:6px;padding:3px 9px;display:inline-block;margin:12px 0 6px}
  .practice .warn{border-left:4px solid var(--tangerine);padding-left:12px}

  /* ---------- quick links ---------- */
  .ql-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .ql{background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
  .ql .q-ask{font-size:14px;color:var(--ink-soft);margin-bottom:6px}
  .ql a{font-family:var(--disp);font-size:16.5px;font-weight:700}

  /* ---------- rules ---------- */
  .rules{background:var(--ink);color:var(--paper);border-radius:var(--radius);padding:26px 28px;margin-top:6px;box-shadow:0 5px 0 rgba(27,36,48,.3)}
  .rules h3{font-family:var(--disp);font-size:21px;font-weight:700;margin-bottom:14px}
  .rules h3 .hl{color:#F5B971}
  .rules ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 26px}
  .rules li{display:flex;gap:10px;font-size:14.5px;color:#E6E0D4}
  .rules li::before{content:'\2713';flex:none;font-weight:700;color:#F5B971}

  /* ---------- video library ---------- */
  #library:not(.has-videos){display:none}
  .lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
  .lib-card{background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .lib-card .cap{padding:13px 16px;font-weight:600;font-size:15px}

  footer{margin-top:60px;border-top:3px solid var(--ink);padding:26px 0 40px;font-size:14px;color:var(--ink-soft)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="masthead">
      <div class="eyebrow" data-t="eyebrow"></div>
      <div class="head-right">
        <div class="lang-switch" role="group" aria-label="Language / Idioma">
          <button id="btn-en" onclick="setLang('en')">EN</button>
          <button id="btn-es" onclick="setLang('es')">ES</button>
        </div>
        <div class="admit" data-t="admit"></div>
      </div>
    </div>
    <h1 id="hero"></h1>
    <p class="sub" data-t="sub"></p>
    <div class="habits" id="habits" aria-label="The three habits"></div>
  </div>
</header>

<section id="triage">
  <div class="wrap">
    <span class="stamp-label" data-t="triageStamp"></span>
    <h2 data-t="triageH2"></h2>
    <p class="lede" data-t="triageLede"></p>
    <div class="grid" id="scenario-grid"></div>
  </div>
</section>

<section id="leave">
  <div class="wrap">
    <span class="stamp-label" data-t="leaveStamp"></span>
    <h2 data-t="leaveH2"></h2>
    <div class="leave-grid" id="leave-grid"></div>
    <div id="leave-howto" style="margin-top:16px"></div>
  </div>
</section>

<section id="howto">
  <div class="wrap">
    <span class="stamp-label" data-t="howtoStamp"></span>
    <h2 data-t="howtoH2"></h2>
    <div id="howto-list"></div>
  </div>
</section>

<section id="practices">
  <div class="wrap">
    <span class="stamp-label" data-t="practiceStamp"></span>
    <h2 data-t="practiceH2"></h2>
    <div id="practice-list"></div>
  </div>
</section>

<section id="quicklinks">
  <div class="wrap">
    <span class="stamp-label" data-t="qlStamp"></span>
    <h2 data-t="qlH2"></h2>
    <p class="lede" data-t="qlLede"></p>
    <div class="ql-grid" id="ql-grid"></div>
  </div>
</section>

<section id="library">
  <div class="wrap">
    <span class="stamp-label" data-t="libStamp"></span>
    <h2 data-t="libH2"></h2>
    <p class="lede" data-t="libLede"></p>
    <div class="lib-grid" id="lib-grid"></div>
  </div>
</section>

<section id="rules-sec">
  <div class="wrap">
    <div class="rules">
      <h3 id="rules-h3"></h3>
      <ul id="rules-list"></ul>
    </div>
  </div>
</section>

<footer>
  <div class="wrap" data-t="footerNote"></div>
</footer>

<div class="fab-wrap">
  <button class="fab top" id="fab-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">&#8593;</button>
  <button class="fab" id="fab-ticket" onclick="document.getElementById('triage').scrollIntoView({behavior:'smooth'})"></button>
</div>

<script>
/* ============================================================
   SHARED SETTINGS — URLs used in both languages.
   ============================================================ */
const SHARED = {
  ticketUrl: "https://forms.monday.com/forms/d6c686d465dd376884de098d2ba11800?r=use1",
  timezoneConverter: "https://dateful.com/time-zone-converter",
  portal: "https://virtualstaffing.bettermode.io/",
  payrollCalendar: "https://drive.google.com/file/d/1zc_WZEU7NcFCsbLcygSdfSHza1sIMWLu/view",
  performanceViewer: "https://datastudio.google.com/u/0/reporting/b576bbbd-a6b9-451e-a72b-161009e8ea35/page/NBoKF",
  hubstaffDownload: "https://hubstaff.com/download",
  hubstaffApp: "https://app.hubstaff.com",
  bankFeeForm: "https://forms.monday.com/forms/2255189029a75374ae78feb1f457120f?r=use1",
  referralPage: "https://virtualstaffingcareers.com/referral/",
};

/* ============================================================
   VIDEOS — add a URL here and the player appears in BOTH
   languages, plus the Video Library section auto-shows.
   Accepted: YouTube, Loom, Vimeo, or direct .mp4/.webm links.
   Keys map to scenarios (s1–s8) and how-tos by name.
     Example:  timesheet: "https://www.loom.com/share/XXXX",
   extraVideos: standalone clips for the library only.
     Example:  { title: "Welcome from Ops", title_es: "Bienvenida de Ops", video: "https://youtu.be/XXXX" }
   ============================================================ */
const VIDEOS = {
  s1:"", s2:"", s3:"", s4:"", s5:"", s6:"", s7:"", s8:"",
  leave:"", install:"", timesheet:"", verify:"", screenshots:"",
  credits:"", timezone:"", connection:"",
  extraVideos: [],
};

/* ============================================================
   CONTENT — everything below exists in "en" and "es".
   Edit both when changing content. Ticket-type names stay in
   English in both languages: they must match the ticket form.
   ============================================================ */
const A_DL = "<a href='"+SHARED.hubstaffDownload+"' target='_blank' rel='noopener'>hubstaff.com/download</a>";
const A_APP = "<a href='"+SHARED.hubstaffApp+"' target='_blank' rel='noopener'>app.hubstaff.com</a>";
const A_CAL_EN = "<a href='"+SHARED.payrollCalendar+"' target='_blank' rel='noopener'>2026 Payroll Calendar</a>";
const A_CAL_ES = "<a href='"+SHARED.payrollCalendar+"' target='_blank' rel='noopener'>Calendario de N\u00F3mina 2026</a>";

const CONTENT = {
en: {
  eyebrow: "Legal Soft \u00B7 Operations Support \u00B7 Virtual Assistants",
  admit: "Admit one \u00B7 New hire",
  hero: "Clock in. Get paid.<br><span class='hl'>Fix anything in between.</span>",
  sub: "Time tracking, attendance changes, tickets, and time off \u2014 the whole playbook on one page.",
  habits: ["Track your time \u2014 timer on, breaks off","Get approvals in writing, with timestamps","File tickets the same day"],
  triageStamp: "Step 1 \u00B7 Find your situation", triageH2: "What happened?",
  triageLede: "Pick the ticket stub that sounds like you. It opens your boarding pass: the exact ticket to file and what to have ready.",
  leaveStamp: "Time off", leaveH2: "Your leave, per year",
  howtoStamp: "Hubstaff basics", howtoH2: "Quick how-tos",
  practiceStamp: "Work smart", practiceH2: "Best practices",
  qlStamp: "Quick links", qlH2: "Where do I go for\u2026",
  qlLede: "The links you\u2019ll need most, and the question each one answers.",
  libStamp: "Watch & learn", libH2: "Video library",
  libLede: "Short walkthroughs of the most common tasks.",
  rulesH3: "Every ticket, <span class='hl'>every time</span>",
  rules: [
    "All dates and times in Pacific \u2014 note it if your screenshots aren\u2019t",
    "Approvals must be written and timestamped \u2014 verbal doesn\u2019t count",
    "Proof of work for any missing hours: emails, call logs, browser history",
    "File the same day, and always before your timesheet is submitted",
    "Following up? Reference your previous ticket number",
  ],
  footerNote: "Questions? Ask your CSM. \u2014 Legal Soft Operations Support",
  panelLabels: { ticketType:"Ticket type", issueType:"Issue type", detail:"Detail", haveReady:"Have these ready before you file",
    pacific:"All dates & times in Pacific", submit:"Submit this ticket", convert:"Convert to Pacific",
    confirmHint:"Tap each item to confirm you have it \u2014 the submit button unlocks when everything is checked.",
    afterFile:"<b>What happens next?</b> You\u2019ll receive an email from the ticketing team with feedback once your ticket is processed. If your ticket is declined, read the feedback closely and follow the next set of instructions." },
  notSure: { q:"None of these sound like me, or I\u2019m not sure which one fits.",

/* ============================================================
   RENDERING — no need to edit below this line.
   ============================================================ */
let LANG = (new URLSearchParams(location.search).get("lang") === "es") ? "es" : "en";
let current = -1;

/* If a field is ever missing from the "es" block (e.g. after a
   content edit), fall back to English instead of breaking. */
function getContent(){
  if(LANG === "en") return CONTENT.en;
  return Object.assign({}, CONTENT.en, CONTENT[LANG] || {});
}

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function videoEmbed(url, title, watchLabel){
  if(!url) return "";
  const t = esc(title || "Video");
  let m;
  if((m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,})/)))
    return frame("<iframe src='https://www.youtube-nocookie.com/embed/"+m[1]+"' title='"+t+"' allowfullscreen loading='lazy'></iframe>");
  if((m = url.match(/loom\.com\/share\/([\w-]+)/)))
    return frame("<iframe src='https://www.loom.com/embed/"+m[1]+"' title='"+t+"' allowfullscreen loading='lazy'></iframe>");
  if((m = url.match(/vimeo\.com\/(\d+)/)))
    return frame("<iframe src='https://player.vimeo.com/video/"+m[1]+"' title='"+t+"' allowfullscreen loading='lazy'></iframe>");
  if(/\.(mp4|webm)(\?|$)/i.test(url))
    return frame("<video controls preload='metadata' title='"+t+"'><source src='"+esc(url)+"'></video>");
  return "<p style='margin-top:12px'><a href='"+esc(url)+"' target='_blank' rel='noopener'>"+esc(watchLabel)+"</a></p>";
  function frame(inner){ return "<div class='video-frame'>"+inner+"</div>"; }
}

function accordion(item, C){
  const d = document.createElement("details");
  const vid = VIDEOS[item.vid];
  d.innerHTML =
    "<summary><span class='sum-left'>"+esc(item.title)+(vid?"<span class='vid-badge'>"+C.videoBadge+"</span>":"")+"</span><span class='chev'>&#9656;</span></summary>"+
    "<div class='inner'>"+videoEmbed(vid, item.title, C.watchLink)+(vid?"<div style='height:14px'></div>":"")+"<ol>"+
    item.steps.map(st=>"<li>"+st+"</li>").join("")+
    "</ol></div>";
  return d;
}

function render(){
  try { renderInner(); } catch(err){
    console.error(err);
    document.body.insertAdjacentHTML("afterbegin",
      "<div style='background:#C2410C;color:#fff;padding:12px 20px;font-family:sans-serif'>Something went wrong loading this page. Please refresh, or contact Ops Support if it keeps happening. / Algo sali\u00F3 mal al cargar la p\u00E1gina. Actualiza, o contacta a Ops Support si contin\u00FAa.</div>");
  }
}

function renderInner(){
  const C = getContent();
  document.documentElement.lang = LANG;
  document.getElementById("btn-en").classList.toggle("on", LANG==="en");
  document.getElementById("btn-es").classList.toggle("on", LANG==="es");

  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = C[el.dataset.t]; });
  document.getElementById("hero").innerHTML = C.hero;

  // habits
  document.getElementById("habits").innerHTML = C.habits.map((h,i)=>
    "<div class='habit'><span class='n'>"+(i+1)+"</span><span class='t'>"+esc(h)+"</span></div>").join("");

  // scenarios
  const grid = document.getElementById("scenario-grid");
  grid.innerHTML = "";
  const panel = document.createElement("div");
  panel.className = "panel"; panel.setAttribute("role","region"); panel.setAttribute("aria-live","polite");
  C.scenarios.forEach((s,i)=>{
    const btn = document.createElement("button");
    btn.className = "stub"; btn.setAttribute("aria-expanded","false");
    const vid = VIDEOS[s.id];
    btn.innerHTML = "<q>"+s.q+"</q><span class='meta'><span class='tag "+s.cat+"'>"+s.catLabel+"</span>"+
      (vid?"<span class='vid-badge'>"+C.videoBadge+"</span>":"")+"</span>";
    btn.addEventListener("click",()=>openScenario(i,btn,panel));
    grid.appendChild(btn);
  });
  // "not sure" escape hatch — routes to CSM instead of guessing
  const ns = document.createElement("button");
  ns.className = "stub notsure"; ns.setAttribute("aria-expanded","false");
  ns.innerHTML = "<q>"+C.notSure.q+"</q><span class='meta'><span class='tag callin' style='background:var(--paper);color:var(--ink-soft);border-color:var(--ink-soft)'>"+esc(C.notSure.tag)+"</span></span>";
  ns.addEventListener("click",()=>openNotSure(ns,panel));
  grid.appendChild(ns);
  grid.appendChild(panel);
  current = -1;

  // floating action button labels
  document.getElementById("fab-ticket").textContent = C.fabTicket;

  // leave cards
  document.getElementById("leave-grid").innerHTML = C.leaveCards.map(l=>
    "<div class='leave "+l.cls+"'><div class='num'>"+l.num+"</div><div class='unit'>"+esc(l.unit)+"</div>"+
    "<h3>"+esc(l.title)+"</h3><p>"+l.body+"</p><span class='unlock'>"+esc(l.unlock)+"</span></div>").join("");

  // leave how-to + how-tos
  const lh = document.getElementById("leave-howto"); lh.innerHTML = ""; lh.appendChild(accordion(C.leaveHowto, C));
  const hl = document.getElementById("howto-list"); hl.innerHTML = "";
  C.howtos.forEach(h=>hl.appendChild(accordion(h, C)));

  // best practices
  const pList = document.getElementById("practice-list"); pList.innerHTML = "";
  C.bestPractices.forEach((p,i)=>{
    const div = document.createElement("div");
    div.className = "practice";
    let subHtml = "";
    if(p.sub){
      subHtml = "<details><summary><span class='sum-left'>"+esc(C.setup)+"</span><span class='chev'>&#9656;</span></summary><div class='inner'>"+
        p.sub.map(s=>"<span class='os'>"+esc(s.label)+"</span><ol>"+s.steps.map(st=>"<li>"+st+"</li>").join("")+"</ol>").join("")+
        "</div></details>";
    }
    div.innerHTML = "<div class='pn'>"+String(i+1).padStart(2,"0")+"</div>"+
      "<div"+(p.warn?" class='warn'":"")+"><div class='pt'>"+esc(p.title)+"</div><div class='pb'>"+p.body+"</div>"+subHtml+"</div>";
    pList.appendChild(div);
  });

  // quick links
  document.getElementById("ql-grid").innerHTML = C.quickLinks.map(l=>
    "<div class='ql'><div class='q-ask'>"+esc(l.ask)+"</div>"+
    "<a href='"+esc(l.url)+"' target='_blank' rel='noopener'>"+esc(l.label)+"</a></div>").join("");

  // rules
  document.getElementById("rules-h3").innerHTML = C.rulesH3;
  document.getElementById("rules-list").innerHTML = C.rules.map(r=>"<li>"+r+"</li>").join("");

  // video library
  const libItems = [];
  C.howtos.concat([C.leaveHowto]).forEach(h=>{ const v=VIDEOS[h.vid]; if(v) libItems.push({title:h.title, video:v}); });
  C.scenarios.forEach(s=>{ const v=VIDEOS[s.id]; if(v) libItems.push({title:s.route.join(" \u2014 "), video:v}); });
  VIDEOS.extraVideos.forEach(v=>{ if(v.video) libItems.push({title:(LANG==="es" && v.title_es)?v.title_es:v.title, video:v.video}); });
  const lib = document.getElementById("library");
  lib.classList.toggle("has-videos", libItems.length>0);
  document.getElementById("lib-grid").innerHTML = libItems.map(v=>
    "<div class='lib-card'>"+videoEmbed(v.video, v.title, C.watchLink)+"<div class='cap'>"+esc(v.title)+"</div></div>").join("");
}

function openScenario(i,btn,panel){
  const C = getContent();
  const buttons = document.querySelectorAll("#scenario-grid .stub");
  if(current===i){ panel.classList.remove("open"); btn.classList.remove("active"); btn.setAttribute("aria-expanded","false"); current=-1; return; }
  buttons.forEach(b=>{b.classList.remove("active");b.setAttribute("aria-expanded","false");});
  btn.classList.add("active"); btn.setAttribute("aria-expanded","true");
  const s = C.scenarios[i];
  const docs = C.docSets[s.docs] || [];
  const L = C.panelLabels;
  panel.innerHTML =
    "<div class='pass-top'>"+
      "<div><span class='lab'>"+L.ticketType+"</span><span class='val'>"+s.route[0]+"</span></div>"+
      "<div class='arrow'>&rarr;</div>"+
      "<div><span class='lab'>"+(s.route[1].startsWith("Make-up") ? L.detail : L.issueType)+"</span><span class='val'>"+s.route[1]+"</span></div>"+
    "</div>"+
    "<div class='pass-body'>"+
    (s.note ? "<p class='note'>"+s.note+"</p>" : "")+
    "<h4>"+L.haveReady+"</h4><ul class='req'>"+
    docs.map(d=>"<li role='checkbox' aria-checked='false' tabindex='0'><span class='box' aria-hidden='true'></span><span>"+d+"</span></li>").join("")+
    "</ul>"+
    "<p class='confirm-hint'>"+esc(L.confirmHint)+"</p>"+
    videoEmbed(VIDEOS[s.id], s.route.join(" \u2014 "), C.watchLink)+
    "<div class='after-file'>"+L.afterFile+"</div>"+
    "<div><span class='pacific'>"+L.pacific+"</span></div>"+
    "<div class='actions'><a class='btn primary locked' id='submit-btn' aria-disabled='true' href='"+SHARED.ticketUrl+"' target='_blank' rel='noopener'>"+L.submit+"</a>"+
    "<a class='btn ghost' href='"+SHARED.timezoneConverter+"' target='_blank' rel='noopener'>"+L.convert+"</a></div>"+
    "</div>";
  // checklist gating: submit unlocks only when every requirement is confirmed
  const items = panel.querySelectorAll(".req li");
  const submitBtn = panel.querySelector("#submit-btn");
  const refresh = ()=>{
    const all = [...items].every(li=>li.classList.contains("checked"));
    submitBtn.classList.toggle("locked", !all);
    submitBtn.setAttribute("aria-disabled", String(!all));
  };
  items.forEach(li=>{
    const toggle = ()=>{ li.classList.toggle("checked"); li.setAttribute("aria-checked", li.classList.contains("checked")); refresh(); };
    li.addEventListener("click", toggle);
    li.addEventListener("keydown", e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); toggle(); } });
  });
  panel.classList.add("open");
  current = i;
  panel.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function openNotSure(btn,panel){
  const C = getContent();
  const buttons = document.querySelectorAll("#scenario-grid .stub");
  if(current==="ns"){ panel.classList.remove("open"); btn.classList.remove("active"); btn.setAttribute("aria-expanded","false"); current=-1; return; }
  buttons.forEach(b=>{b.classList.remove("active");b.setAttribute("aria-expanded","false");});
  btn.classList.add("active"); btn.setAttribute("aria-expanded","true");
  panel.innerHTML =
    "<div class='pass-top'><div><span class='lab'>&nbsp;</span><span class='val'>"+esc(C.notSure.title)+"</span></div></div>"+
    "<div class='pass-body'><p style='font-size:15.5px'>"+C.notSure.body+"</p></div>";
  panel.classList.add("open");
  current = "ns";
  panel.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function setLang(l){
  if(l===LANG) return;
  LANG = l;
  const url = new URL(location.href);
  url.searchParams.set("lang", l);
  history.replaceState(null, "", url);
  render();
}

render();
</script>
